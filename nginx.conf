# ==============================================================
# CONFIGURAÇÃO REVERSA NGINX - SPM STORE SISTEMA FISCAL
# ==============================================================
# Instruções de instalação no servidor Linux (Ubuntu/Debian):
# 1. Copie este arquivo para /etc/nginx/sites-available/spmfiscal.conf
#    sudo cp nginx.conf /etc/nginx/sites-available/spmfiscal.conf
# 2. Edite os nomes de domínio em 'server_name'
# 3. Crie o link simbólico:
#    sudo ln -s /etc/nginx/sites-available/spmfiscal.conf /etc/nginx/sites-enabled/
# 4. Obtenha o SSL gratuito via Certbot:
#    sudo certbot --nginx -d seudominio.com.br -d fiscal.seudominio.com.br
# 5. Reinicie o Nginx:
#    sudo nginx -t && sudo systemctl reload nginx
# ==============================================================

# Redirecionamento HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name spmstore.spmoficial.com.br fiscal.spmoficial.com.br spmoficial.com.br;

    # Permitir validação Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS com Proxy Reverso
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spmstore.spmoficial.com.br fiscal.spmoficial.com.br spmoficial.com.br;

    # Certificados SSL (Atualize com o caminho do seu Certbot/Cloudflare)
    # ssl_certificate /etc/letsencrypt/live/fiscal.spmoficial.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/fiscal.spmoficial.com.br/privkey.pem;

    # Otimizações de SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Permitir uploads grandes (lotes de PDFs e XMLs de DANFEs)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Headers de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Proxy para o Backend SPM Fiscal (Porta 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Suporte a WebSockets e Conexões Persistentes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Identificação de Domínio e IP Real
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts estendidos para importação de lotes pesados
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
